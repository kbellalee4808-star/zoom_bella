<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>벨라의 크루즈 라운지</title>
<meta name="description" content="벨라와 1:1 줌 미팅 예약, 크루즈클럽 미팅, 화요일 멤버십 줌 강의 입장을 한곳에서">
<meta property="og:title" content="🛳 벨라의 크루즈 라운지">
<meta property="og:description" content="편하게 문을 골라 들어오세요 ☕">
<meta name="theme-color" content="#1B3A5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'GmarketSans';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'GmarketSans';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap}
:root{--navy:#1B3A5C;--navy2:#24507c;--gold:#D4A94A;--gold-soft:#f5ead2;--ivory:#FAF7F2;--ink:#1f2a37;--muted:#6b7480;--line:#ece4d6;--card:#fff;--green:#2f8f5b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--ivory);color:var(--ink);line-height:1.6;word-break:keep-all;overflow-wrap:break-word;min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(36px + env(safe-area-inset-bottom))}
h1,h2,h3,.gm{font-family:'GmarketSans','Noto Sans KR',sans-serif}

.lang{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:20;display:flex;background:rgba(255,255,255,.92);border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.lang button{border:0;background:transparent;font-size:18px;width:44px;height:36px;border-radius:999px;cursor:pointer;opacity:.45}
.lang button.on{background:var(--gold-soft);opacity:1}

.hero{margin:0 -16px;padding:calc(60px + env(safe-area-inset-top)) 24px 48px;background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;text-align:center;border-radius:0 0 28px 28px}
.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;border:3px solid var(--gold);background:var(--gold-soft) center/cover no-repeat;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.over{font-family:'GmarketSans',sans-serif;color:var(--gold);font-size:12px;letter-spacing:.16em;font-weight:700;margin-bottom:6px}
.hero h1{font-size:28px;line-height:1.35;margin-bottom:10px}
.hero p{font-size:15px;opacity:.9}

.now{margin-top:-24px;position:relative;z-index:2;background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 8px 24px rgba(27,58,92,.10);display:flex;align-items:center;gap:14px}
.now .flag{font-size:30px;line-height:1}
.now .k{font-size:12px;color:var(--muted)}
.now .v{font-size:16px;font-weight:700;color:var(--navy)}
.now .t{margin-left:auto;text-align:right}
.now .t .clock{font-family:'GmarketSans',sans-serif;font-size:20px;color:var(--navy)}

section{margin-top:34px}
section > h2{font-size:20px;color:var(--navy);margin-bottom:14px}

.door{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden}
.door-h{display:flex;align-items:center;gap:14px;padding:18px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font:inherit;color:inherit;min-height:76px}
.door-h .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.ic.gold{background:var(--gold-soft)}
.ic.navy{background:#e3eaf2}
.door-h .tt{flex:1;min-width:0}
.door-h b{display:block;font-family:'GmarketSans',sans-serif;font-size:18px;color:var(--navy)}
.door-h span{font-size:14px;color:var(--muted)}
.door-h .arr{font-size:20px;color:var(--gold);transition:transform .25s}
.door.open .arr{transform:rotate(90deg)}
.door-b{padding:0 18px 18px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.steps span{font-size:13px;background:var(--ivory);border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--navy)}
.cal{width:100%;height:700px;border:0;border-radius:14px;background:var(--ivory)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.ext{display:inline-block;margin-top:6px;font-size:14px;color:var(--navy);font-weight:700}

.class{padding:18px}
.class .row{display:flex;align-items:center;gap:14px}
.class .when{margin-top:14px;background:var(--ivory);border-radius:14px;padding:14px}
.class .when .d{font-size:16px;font-weight:700;color:var(--navy)}
.class .when .kst{font-size:13px;color:var(--muted);margin-top:2px}
.class .cd{margin-top:8px;font-family:'GmarketSans',sans-serif;font-size:15px;color:var(--gold)}
.class .live{color:var(--green)}
.go{display:flex;align-items:center;justify-content:center;margin-top:12px;min-height:54px;border-radius:14px;background:var(--gold);color:var(--navy);font-family:'GmarketSans',sans-serif;font-weight:700;font-size:16px;text-decoration:none;border:0;width:100%}
.go.off{background:#ece6da;color:#9a917f;pointer-events:none}
.pw{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}

.about{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:14px;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;text-decoration:none;margin-top:30px}
footer{text-align:center;margin-top:24px;color:var(--muted);font-size:14px}

@media (max-width:360px){.hero h1{font-size:24px}.door-h b{font-size:16px}.cal{height:660px}}
</style>
</head>

       d2:'크루즈클럽', d2s:'크루즈클럽 멤버·파트너 1:1 미팅',
       steps:['① 날짜','② 시간','③ 이름·이메일','④ 완료 → 메일로 줌 링크'],
       calNote:'시간은 자동으로 내 나라 시간으로 보여요. 예약 화면 버튼은 영어로 나와요.',
       newTab:'예약 화면이 안 보이면 새 창으로 열기 ↗',
       classH:'줌 강의실', next:'다음 강의', kst:'한국 시간', left:'남음', live:'지금 강의 중이에요!',
       soon:'곧 시작해요!', enter:'📲 지금 입장하기', locked:'시작 10분 전에 입장 버튼이 열려요',
       noLink:'입장 링크는 준비 중이에요', pw:'입장 비밀번호', d:'일', h:'시간', m:'분',
       about:'👋 벨라가 궁금하다면 소개 보기', foot:'· 벨라 크루즈 노마드 🛳 ·' },
  en:{ title:"Bella's Cruise Lounge", sub:'Pick a door and come on in ☕',
       nowK:'Where Bella is now', nowT:"Bella's local time",
       meetH:"Let's meet 1:1", d1:'Nice to meet you', d1s:'A relaxed 30-min first Zoom with Bella',
       d2:'Cruise Club', d2s:'1:1 for Cruise Club members & partners',
       steps:['① Date','② Time','③ Name & email','④ Done → Zoom link by email'],
       calNote:'Times are shown in your own time zone automatically.',
       newTab:"Can't see the calendar? Open in a new tab ↗",
       classH:'', about:'👋 Get to know Bella first', foot:'· Bella Cruise Nomad 🛳 ·' }
};

(function(){
  var lang='ko', params=new URLSearchParams(location.search);
  function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  var pl=params.get('lang');
  if(pl==='ko'||pl==='en') lang=pl;
  else { var s=load('lounge_lang'); lang=(s==='ko'||s==='en')?s:((navigator.language||'ko').toLowerCase().indexOf('ko')===0?'ko':'en'); }

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  /* --- time helpers --- */
  function kstDateStr(d){ return new Date(d.getTime()+9*3600e3).toISOString().slice(0,10); }
  function kstToUtc(dateStr, hm){ var p=hm.split(':'); return new Date(Date.parse(dateStr+'T00:00:00Z') + ((+p[0]-9)*60 + +p[1])*60e3); }
  function nextClass(c, now){
    for(var i=0;i<60;i++){
      var day=new Date(now.getTime()+9*3600e3+i*864e5);
      if(day.getUTCDay()!==c.day) continue;
      var ds=day.toISOString().slice(0,10);
      if(HOLIDAYS.indexOf(ds)>=0) continue;
      var st=kstToUtc(ds,c.start), en=kstToUtc(ds,c.end);
      if(en>now) return {start:st,end:en,date:ds};
    }
    return null;
  }
  function fmtLocal(d){
    try{ return new Intl.DateTimeFormat(lang==='ko'?'ko-KR':'en-US',{month:'long',day:'numeric',weekday:'short',hour:'numeric',minute:'2-digit'}).format(d); }
    catch(e){ return d.toString(); }
  }
  function place(now){
    var ds=kstDateStr(now);
    for(var i=0;i<PLACES.length;i++){ if(ds>=PLACES[i].from && ds<=PLACES[i].to) return PLACES[i]; }
    return HOME;
  }

  /* --- render --- */
  function render(){
    var L=T[lang];
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-i]').forEach(function(el){ var k=el.getAttribute('data-i'); if(L[k]!=null) el.textContent=L[k]; });
    document.querySelectorAll('[data-steps]').forEach(function(el){ el.innerHTML=L.steps.map(function(s){return '<span>'+esc(s)+'</span>';}).join(''); });
    document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l')===lang); });
    document.querySelectorAll('[data-door]').forEach(function(door){
      var url=CAL[door.getAttribute('data-door')][lang];
      door.querySelector('.ext').href=url;
      var f=door.querySelector('iframe');
      f.dataset.src=url+'?hide_gdpr_banner=1&background_color=faf7f2&text_color=1f2a37&primary_color=1b3a5c';
      if(door.classList.contains('open')) f.src=f.dataset.src;
    });
    document.getElementById('classes').hidden = (lang!=='ko');
    document.getElementById('aboutLink').href = ABOUT + (lang==='en'?'?lang=en':'');
    tick();
  }

  function tick(){
    var now=new Date(), L=T[lang];
    var p=place(now);
    document.getElementById('nFlag').textContent=p.flag;
    document.getElementById('nPlace').textContent=p[lang];
    try{ document.getElementById('nClock').textContent=new Intl.DateTimeFormat(lang==='ko'?'ko-KR':'en-US',{hour:'numeric',minute:'2-digit',timeZone:p.tz}).format(now); }catch(e){}
    if(lang!=='ko') return;
    document.querySelectorAll('[data-class]').forEach(function(box){
      var c=CLASSES[box.getAttribute('data-class')], n=nextClass(c,now);
      var html='<div class="row"><span class="ic navy" style="width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px">'+c.emoji+'</span>'+
               '<span class="tt"><b class="gm" style="display:block;font-size:18px;color:var(--navy)">'+esc(c.ko)+'</b><span style="font-size:14px;color:var(--muted)">'+esc(c.koSub)+'</span></span></div>';
      if(n){
        var ms=n.start-now, live=ms<=0, open=ms<=10*60e3;
        var cd;
        if(live) cd='<div class="cd live">🔴 '+L.live+'</div>';
        else if(open) cd='<div class="cd live">⏰ '+L.soon+'</div>';
        else { var d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), m=Math.floor(ms%36e5/6e4);
               cd='<div class="cd">⏳ '+(d?d+L.d+' ':'')+(d||h?h+L.h+' ':'')+m+L.m+' '+L.left+'</div>'; }
        html+='<div class="when"><div class="d">'+L.next+' · '+esc(fmtLocal(n.start))+'</div>'+
              '<div class="kst">'+L.kst+' '+c.start+'~'+c.end+'</div>'+cd+'</div>';
        if(!c.zoom) html+='<span class="go off">'+L.noLink+'</span>';
        else if(open) html+='<a class="go" href="'+esc(c.zoom)+'" target="_blank" rel="noopener">'+L.enter+'</a>';
        else html+='<span class="go off">'+L.locked+'</span>';
        if(c.zoom && c.pw) html+='<p class="pw">🔑 '+L.pw+' '+esc(c.pw)+'</p>';
      }
      box.innerHTML=html;
    });
  }

  document.querySelectorAll('[data-door] .door-h').forEach(function(btn){
    btn.addEventListener('click',function(){
      var door=btn.parentNode, body=door.querySelector('.door-b'), f=door.querySelector('iframe');
      var open=!door.classList.contains('open');
      door.classList.toggle('open',open); body.hidden=!open;
      if(open && !f.getAttribute('src')) f.src=f.dataset.src;
    });
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click',function(){ lang=b.getAttribute('data-l'); store('lounge_lang',lang); render(); });
  });
  var want=params.get('door');
  render();
  if(want && CAL[want]){ var d=document.querySelector('[data-door="'+want+'"] .door-h'); if(d){ d.click(); d.scrollIntoView(); } }
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
