<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>1:1 줌 미팅</title>
<meta name="description" content="크루즈 멤버십과 파트너, 1:1 줌으로 편하게 이야기 나눠요">
<meta property="og:title" content="💬 1:1 줌 미팅 신청">
<meta property="og:description" content="결정하는 자리가 아니라, 알아보는 자리예요 ☕">
<meta name="theme-color" content="#1B3A5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'GmarketSans';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'GmarketSans';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:700;font-display:swap}
:root{
  --navy:#1B3A5C;--navy2:#24507c;--gold:#D4A94A;--gold-soft:#f5ead2;--ivory:#FAF7F2;
  --ink:#1f2a37;--muted:#6b7480;--line:#ece4d6;--card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--ivory);color:var(--ink);line-height:1.65;word-break:keep-all;overflow-wrap:break-word;min-height:100dvh}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
h1,h2,h3,.gm{font-family:'GmarketSans','Noto Sans KR',sans-serif}

/* language toggle */
.lang{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:20;display:flex;background:rgba(255,255,255,.92);border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.lang button{border:0;background:transparent;font-size:18px;width:44px;height:36px;border-radius:999px;cursor:pointer;opacity:.45}
.lang button.on{background:var(--gold-soft);opacity:1}

/* hero */
.hero{margin:0 -16px;padding:calc(64px + env(safe-area-inset-top)) 24px 40px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;text-align:center;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;left:-10%;right:-10%;bottom:-40px;height:80px;background:radial-gradient(ellipse at center,rgba(212,169,74,.25),transparent 70%)}
.avatar{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;border:3px solid var(--gold);background:var(--gold-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.badge{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;margin-bottom:16px}
.hero h1{font-size:27px;line-height:1.4;font-weight:700;margin-bottom:14px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .sub{font-size:15px;opacity:.9}

/* info chips */
.info{margin-top:-22px;position:relative;z-index:2;background:var(--card);border-radius:18px;padding:6px 18px;box-shadow:0 8px 24px rgba(27,58,92,.10)}
.info .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.info .row:last-child{border-bottom:0}
.info .ic{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.info .k{color:var(--muted);font-size:13px;width:52px;flex-shrink:0}
.info .v{font-weight:500}

/* sections */
section.blk{margin-top:36px}
.over{font-family:'GmarketSans',sans-serif;color:var(--gold);font-size:12px;letter-spacing:.14em;font-weight:700;margin-bottom:4px}
.blk h2{font-size:21px;color:var(--navy);margin-bottom:16px;line-height:1.4}

/* host */
.host{background:var(--card);border-radius:18px;padding:22px 20px;border:1px solid var(--line)}
.host .nm{font-family:'GmarketSans',sans-serif;font-size:19px;color:var(--navy);font-weight:700}
.host .tg{margin-top:6px;font-size:15px;color:var(--ink)}
.host .st{display:inline-block;margin-top:12px;background:var(--gold-soft);color:var(--navy);font-weight:700;font-size:14px;padding:6px 12px;border-radius:10px}
.host .bk{margin-top:10px;font-size:14px;color:var(--muted)}
.btn-line{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;min-height:50px;border-radius:14px;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;text-decoration:none;font-size:15px}

/* gallery */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.gal figure{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--gold-soft)}
.gal figure.wide{grid-column:1/-1;aspect-ratio:3/2}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}

/* tabs */
.tabs{display:flex;gap:8px;background:#efe8db;padding:5px;border-radius:16px;margin-bottom:16px}
.tabs button{flex:1;min-height:50px;border:0;border-radius:12px;background:transparent;font:inherit;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(27,58,92,.25)}
.pane{display:none}
.pane.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pills{display:flex;gap:8px;margin-bottom:14px}
.pills button{flex:1;min-height:46px;border-radius:999px;border:1.5px solid var(--gold);background:#fff;color:var(--navy);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.pills button.on{background:var(--gold);color:var(--navy)}
.lead{font-size:16px;font-weight:500;color:var(--navy);background:var(--gold-soft);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.cards{display:grid;gap:10px}
.c{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.c .e{font-size:26px;line-height:1;flex-shrink:0;width:34px;text-align:center;padding-top:2px}
.c b{display:block;font-size:16px;color:var(--navy);margin-bottom:2px}
.c span{font-size:14px;color:var(--muted)}
.note{margin-top:12px;font-size:14px;color:var(--muted);padding:0 4px}
.note::before{content:'💡 '}

/* flow */
.flow{list-style:none;position:relative;padding-left:4px}
.flow li{display:flex;align-items:center;gap:14px;padding:10px 0;font-size:15px;font-weight:500;position:relative}
.flow li:not(:last-child)::after{content:'';position:absolute;left:17px;top:46px;bottom:-12px;width:2px;background:var(--line)}
.flow .n{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'GmarketSans',sans-serif;font-weight:700;flex-shrink:0;position:relative;z-index:1}

/* dream */
.dream{display:grid;gap:10px}
.dream .d{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff 0%,var(--gold-soft) 100%);border:1px solid var(--line);border-radius:16px;padding:16px}
.dream .dn{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-family:'GmarketSans',sans-serif;font-weight:700;flex-shrink:0}
.dream .dt{font-size:16px;font-weight:500;color:var(--navy)}
.dnote{margin-top:12px;font-size:14px;color:var(--muted);text-align:center}

/* questions */
.qs{display:flex;flex-wrap:wrap;gap:8px}
.qs span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px}

/* cta */
.cta{margin-top:40px;background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:26px 20px;text-align:center}
.cta .t{font-size:15px;opacity:.92;margin-bottom:14px}
.go{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:16px;background:var(--gold);color:var(--navy);font-family:'GmarketSans',sans-serif;font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 6px 18px rgba(212,169,74,.4)}
.go:active{transform:scale(.98)}
.pw{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;flex-wrap:wrap}
.pw .code{font-family:'GmarketSans',sans-serif;font-size:22px;letter-spacing:.12em;color:var(--gold)}
.pw button{min-height:40px;padding:0 14px;border-radius:10px;border:0;background:#fff;color:var(--navy);font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.cta .nm{margin-top:12px;font-size:14px;opacity:.88}

footer{text-align:center;margin-top:28px;color:var(--muted);font-size:14px}
footer .sig{margin-top:4px;color:var(--navy);font-weight:500}

@media (max-width:360px){
  .hero h1{font-size:23px}
  .blk h2{font-size:19px}
  .tabs button{font-size:14px}
  .info .k{width:44px}
}
@media (min-width:480px){.hero{border-radius:0 0 32px 32px}}
</style>
</head>
<body>

<div class="lang" role="group" aria-label="language">
  <button type="button" data-l="ko" aria-label="한국어">🇰🇷</button>
  <button type="button" data-l="en" aria-label="English">🇺🇸</button>
</div>

<div class="wrap">

  <header class="hero">
    <div class="avatar" id="avatar">🛳</div>
    <div class="badge" data-i="badge"></div>
    <h1 data-h="title"></h1>
    <p class="sub" data-i="sub"></p>
  </header>

  <div class="info">
    <div class="row"><span class="ic">⏱</span><span class="k" data-i="kDur"></span><span class="v" data-i="vDur"></span></div>
    <div class="row"><span class="ic">📍</span><span class="k" data-i="kWhere"></span><span class="v" data-i="vWhere"></span></div>
    <div class="row"><span class="ic">🎥</span><span class="k" data-i="kCam"></span><span class="v" data-i="vCam"></span></div>
  </div>

  <section class="blk">
    <div class="over">YOUR HOST</div>
    <h2 data-i="hostTitle"></h2>
    <div class="host">
      <div class="nm" id="hName"></div>
      <div class="tg" id="hTag"></div>
      <div class="st" id="hStats"></div>
      <div class="bk" id="hExtra"></div>
      <div class="gal" id="gal"></div>
      <a class="btn-line" id="hIg" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <section class="blk">
    <div class="over">WHAT WE'LL TALK ABOUT</div>
    <h2 data-i="tabsTitle"></h2>
    <div class="tabs" role="tablist">
      <button type="button" data-tab="partner" data-i="tabPartner"></button>
      <button type="button" data-tab="travel" data-i="tabTravel"></button>
    </div>

    <div class="pane" id="pane-partner">
      <div class="pills">
        <button type="button" data-step="new" data-i="pillNew"></button>
        <button type="button" data-step="mem" data-i="pillMem"></button>
      </div>
      <div id="step-new">
        <p class="lead" data-i="newLead"></p>
        <div class="cards" data-cards="newCards"></div>
      </div>
      <div id="step-mem" hidden>
        <p class="lead" data-i="memLead"></p>
        <div class="cards" data-cards="memCards"></div>
      </div>
      <p class="note" data-i="pNote"></p>
    </div>

    <div class="pane" id="pane-travel">
      <p class="lead" data-i="trLead"></p>
      <div class="cards" data-cards="trCards"></div>
    </div>
  </section>

  <section class="blk">
    <div class="over">HOW IT GOES</div>
    <h2 data-i="flowTitle"></h2>
    <ol class="flow" data-list="flow"></ol>
  </section>

  <section class="blk">
    <div class="over">BEFORE WE MEET</div>
    <h2 data-i="dTitle"></h2>
    <div class="dream" data-dream="dqs"></div>
    <p class="dnote" data-i="dNote"></p>
  </section>

  <section class="blk">
    <div class="over">BRING YOUR QUESTIONS</div>
    <h2 data-i="qTitle"></h2>
    <div class="qs" data-chips="qs"></div>
  </section>

  <div class="cta" id="cta">
    <p class="t" data-i="ctaLead"></p>
    <a class="go" id="goBtn" target="_blank" rel="noopener" data-i="ctaBtn"></a>
    <div class="pw" id="pwBox">
      <span data-i="pwLabel"></span>
      <span class="code" id="pwCode"></span>
      <button type="button" id="pwCopy" data-i="copy"></button>
    </div>
    <p class="nm" data-i="nameNote"></p>
  </div>

  <footer>
    <p data-i="foot"></p>
    <p class="sig" id="sig"></p>
  </footer>
</div>

(function(){
  var lang = 'ko', tab = 'partner', step = 'new';
  var params = new URLSearchParams(location.search);

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function pick(k){var v = lang==='en' ? HOST[k+'En'] : ''; return v || HOST[k] || '';}
  function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}

  // language: ?lang= → saved → browser
  var pl = params.get('lang');
  if (pl==='ko'||pl==='en') lang = pl;
  else { var s = load('zoom_lang'); if (s==='ko'||s==='en') lang = s;
         else lang = (navigator.language||'ko').toLowerCase().indexOf('ko')===0 ? 'ko' : 'en'; }
  if (params.get('tab')==='travel') tab = 'travel';

  function cards(arr){
    return arr.map(function(c){return '<div class="c"><div class="e">'+c[0]+'</div><div><b>'+esc(c[1])+'</b><span>'+esc(c[2])+'</span></div></div>';}).join('');
  }

  function render(){
    var L = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach(function(el){ el.textContent = L[el.getAttribute('data-i')]; });
    document.querySelectorAll('[data-h]').forEach(function(el){ el.innerHTML = L[el.getAttribute('data-h')]; });
    document.querySelectorAll('[data-cards]').forEach(function(el){ el.innerHTML = cards(L[el.getAttribute('data-cards')]); });
    document.querySelector('[data-dream="dqs"]').innerHTML = L.dqs.map(function(q,i){return '<div class="d"><span class="dn">'+(i+1)+'</span><span class="dt">'+esc(q)+'</span></div>';}).join('');
    document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l')===lang); });

    // host
    var nm = pick('name');
    document.getElementById('hName').textContent = nm;
    var tg = pick('tag'), st = lang==='en' ? HOST.statsEn : HOST.stats, ex = pick('extra');
    var elT = document.getElementById('hTag'), elS = document.getElementById('hStats'), elE = document.getElementById('hExtra');
    elT.textContent = tg; elT.hidden = !tg;
    elS.textContent = st; elS.hidden = !st;
    elE.textContent = ex; elE.hidden = !ex;
    var ig = pick('ig').replace(/^@/,''), igA = document.getElementById('hIg');
    if (ig){ igA.href = 'https://instagram.com/'+encodeURIComponent(ig); igA.textContent = L.ig+' @'+ig; igA.hidden = false; }
    else igA.hidden = true;
    var av = document.getElementById('avatar');
    if (HOST.photo){ av.style.backgroundImage = 'url("'+HOST.photo.replace(/"/g,'')+'")'; av.textContent = ''; }
    document.getElementById('sig').textContent = nm ? '· '+nm+' 🛳 ·' : '· 🛳 ·';

    // zoom
    document.getElementById('gal').innerHTML = GALLERY.map(function(g,i){
      return '<figure'+(i===2?' class="wide"':'')+'><img src="'+g[0]+'" alt="'+esc(lang==='en'?g[2]:g[1])+'" loading="lazy"><figcaption>'+esc(lang==='en'?g[2]:g[1])+'</figcaption></figure>';
    }).join('');
    var go = document.getElementById('goBtn');
    if (HOST.zoom){ go.href = HOST.zoom; go.hidden = false; } else go.hidden = true;
    document.getElementById('pwCode').textContent = HOST.pw;
    document.getElementById('pwBox').hidden = !HOST.pw;

    setTab(tab); setStep(step);
  }

  function lists(){
    var L = T[lang], fl = tab==='travel' ? L.flowT : L.flowP, q = tab==='travel' ? L.qsT : L.qsP;
    document.querySelector('[data-list="flow"]').innerHTML = fl.map(function(t,i){return '<li><span class="n">'+(i+1)+'</span>'+esc(t)+'</li>';}).join('');
    document.querySelector('[data-chips="qs"]').innerHTML = q.map(function(x){return '<span>'+esc(x)+'</span>';}).join('');
  }
  function setTab(t){
    tab = t; lists();
    document.querySelectorAll('.tabs button').forEach(function(b){ var on = b.getAttribute('data-tab')===t; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); });
    document.getElementById('pane-partner').classList.toggle('on', t==='partner');
    document.getElementById('pane-travel').classList.toggle('on', t==='travel');
  }
  function setStep(s){
    step = s;
    document.querySelectorAll('.pills button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-step')===s); });
    document.getElementById('step-new').hidden = s!=='new';
    document.getElementById('step-mem').hidden = s!=='mem';
  }

  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ lang = b.getAttribute('data-l'); store('zoom_lang', lang); render(); });
  });
  document.querySelectorAll('.tabs button').forEach(function(b){ b.addEventListener('click', function(){ setTab(b.getAttribute('data-tab')); }); });
  document.querySelectorAll('.pills button').forEach(function(b){ b.addEventListener('click', function(){ setStep(b.getAttribute('data-step')); }); });

  document.getElementById('pwCopy').addEventListener('click', function(){
    var btn = this, txt = HOST.pw;
    function done(){ btn.textContent = T[lang].copied; setTimeout(function(){ btn.textContent = T[lang].copy; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
    function fallback(){ var t = document.createElement('textarea'); t.value = txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(t); done(); }
  });

  render();
})();
</script>
